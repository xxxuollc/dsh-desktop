name: DSHMobile
options:
  bundleIdPrefix: com.xuquanke
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
targets:
  DSHMobile:
    type: application
    platform: iOS
    sources:
      - DSHMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xuquanke.dshmobile
        PRODUCT_NAME: DSH Mobile
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DSHMobile/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
