<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; style-src 'unsafe-inline'; script-src 'self'" />
<title>局域网访问</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0b0d14; color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px; -webkit-user-select: none; user-select: none;
    padding: 20px;
  }
  h1 { font-size: 15px; margin: 0 0 4px; color: #f1f5f9; }
  .sub { color: #64748b; font-size: 12px; margin-bottom: 18px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .switch { position: relative; width: 44px; height: 24px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; border-radius: 12px; background: #334155; cursor: pointer; transition: .2s;
  }
  .slider::before {
    content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%;
    left: 3px; top: 3px; background: #cbd5e1; transition: .2s;
  }
  .switch input:checked + .slider { background: #22d3ee; }
  .switch input:checked + .slider::before { transform: translateX(20px); background: #0b0d14; }
  .card {
    background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;
  }
  .addr { display: flex; align-items: center; gap: 12px; }
  .addr img { width: 72px; height: 72px; border-radius: 6px; background: #fff; padding: 3px; }
  .addr .info { flex: 1; min-width: 0; }
  .addr .ip { font-family: "SF Mono", Menlo, monospace; font-size: 12px; color: #22d3ee; word-break: break-all; }
  .addr .hint { color: #64748b; font-size: 11px; margin-top: 3px; }
  .addr .copyUrl { margin-top: 8px; }
  .empty { color: #64748b; text-align: center; padding: 18px 0; }
  .token { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .token code { font-family: "SF Mono", Menlo, monospace; font-size: 11px; color: #94a3b8; word-break: break-all; }
  button {
    background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px;
    padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  button:hover { background: #334155; }
  .note { color: #64748b; font-size: 11px; line-height: 1.7; margin-top: 12px; }
  .warn { color: #fbbf24; }
  .hide { display: none; }
</style>
</head>
<body>
  <h1>局域网访问</h1>
  <div class="sub">同一 Wi-Fi 下的手机/平板可扫码直接使用 DSH（会话与任务完全同步）</div>

  <div class="row">
    <span>启用局域网访问</span>
    <label class="switch"><input type="checkbox" id="toggle"><span class="slider"></span></label>
  </div>

  <div id="addrList"></div>

  <div class="card hide" id="tokenCard">
    <div style="color:#94a3b8;font-size:12px;margin-bottom:6px">访问令牌（即密码，勿外传）</div>
    <div class="token">
      <code id="tokenText"></code>
      <button id="copyToken">复制</button>
      <button id="regenerate">重置</button>
    </div>
  </div>

  <div class="note">
    <div class="warn">⚠ 安全提示：令牌即访问权限，扫码者可操作本机 DSH（能执行命令）。只给信任的人。</div>
    <div style="margin-top:8px">跨网络访问（人在外面连家里的机器）需要认证 + 隧道，属于后续版本能力。</div>
  </div>

<script src="lan-panel.js"></script>
</body>
</html>
