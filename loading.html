<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
<title>DSH Desktop</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #0b0d14;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none;
  }
  .box { text-align: center; }
  .spinner {
    width: 44px; height: 44px; margin: 0 auto 22px;
    border: 3px solid rgba(148, 163, 184, .25);
    border-top-color: #22d3ee;
    border-radius: 50%;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status { font-size: 14px; color: #94a3b8; letter-spacing: .3px; }
  .logo { font-size: 18px; font-weight: 600; margin-bottom: 18px; color: #f1f5f9; }
  .logo b { color: #22d3ee; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">DSH <b>Desktop</b></div>
    <div class="spinner"></div>
    <div id="status">正在检测 DSH 服务…</div>
  </div>
</body>
</html>
